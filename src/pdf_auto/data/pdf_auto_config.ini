# pdf-auto packaged DEFAULT configuration TEMPLATE.
#
# This file ships inside the installed package as a last-resort fallback. It
# keeps the structural defaults (integration, pdfgetx, temperature) and the
# conventional ZMQ socket names, but the site-specific filesystem roots under
# [PATH] are PLACEHOLDERS. For a real deployment, point the workflow at a
# populated INI via `--config /path/to/config.ini` or the PDF_AUTO_CONFIG
# environment variable (the beamline deployment keeps its live INI at
# /home/xf28id1/src/pdf-auto/pdf_auto_config.ini).

[topics]
raw_db = pdf
an_db = pdf-analysis


# ZMQ source that pdf-analysis listens to for raw run documents.
[LISTEN TO]
zmq_address = ipc:///var/lib/bluesky-zmq-proxy/pdf-ipc-in-ipc-out/out.sock
# RemoteDispatcher prefix filter; matches the publisher's document prefix.
prefix = raw


# ZMQ proxies for the re-published `reduced` stream. publish_host and
# subscribe_host are DIFFERENT proxy out.sock files, bridged upstream; do not
# collapse them into one address.
[PUBLISH TO]
publish_host = ipc:///var/lib/bluesky-zmq-proxy/pdf-tcp-in-ipc-out/out.sock
subscribe_host = ipc:///var/lib/bluesky-zmq-proxy/pdf-ipc-in-ipc-out/out.sock
# Publisher prefix bytestring; must not contain a space.
prefix = reduced


# Filesystem roots and calibration files. PLACEHOLDERS -- override for your site.
[PATH]
# Root under which processed data is written.
user_data = /PATH/TO/user_data
tiff_base = tiff_base
config_base = config_base
pdfgetx = pdfgetx
# Detector/mode calibration directories (resolved beneath config_base).
pilatus_PDF = pilatus_PDF
pilatus_XRD = pilatus_XRD
pe1c_PDF = pe1c_PDF
pe1c_XRD = pe1c_XRD
pe2c_SAXS = pe2c_SAXS
lambda_SAXS = lambda_SAXS
# Masks and PONI files (resolved beneath the selected calibration directory).
mask_01 = Mask_pos1_ext_BS.npy
mask_02 = Mask_pos2_ext_BS.npy
mask_03 = Mask_pos3_ext_BS.npy
stitched_mask = Mask_stitched.npy
merged_poin = merged.poni
mask_pe1c = Mask.npy
poni_pe1c = xpdAcq_calib_info.poni
mask_pe2c = Mask.npy
poni_pe2c = xpdAcq_calib_info.poni
mask_pilatus = Mask.npy
poni_pilatus = xpdAcq_calib_info.poni
mask_lambda = Mask.npy
poni_lambda = xpdAcq_calib_info.poni
# Flat-field images (resolved beneath config_base).
flat_filed = flat_field
flat_field_pila = flat_filed_pila.tiff
flat_field_pe1c = flat_filed_pe1c.tiff
flat_field_pe2c = flat_filed_pe2c.tiff
flat_field_lambda = flat_field_lambda.tiff


[SUM]
osetx = 27
osety = 27
use_flat_field_pila = False
use_flat_field_pe1c = False
use_flat_field_pe2c = False
use_flat_field_lambda = False
num_positions = 3
detector_Xmotor = Grid_X
detector_Ymotor = Grid_Y

## unit: mm
pixel_size = 0.172

## unit: m (distance below this value is classified as a PDF scan)
PDF_limit = 0.6

## unit: m (distance above this value is classified as a SAXS scan)
SAXS_limit = 2.56

[INTEGRATION]
# npt_rad is equivalent to binning
npt_rad = 2048
npt_azim = 360
polarization = 0.99
UNIT = q_A^-1
low_limit_pcfilter = 2
up_limit_pcfilter = 98

[pdfgetx3]
do_reduction = True
use_auto_bkg = True
backgroundfile =
rpoly = 0.95
qmaxinst = 29.0
qmin = 0.6
qmax = 22.0
rmin = 0.0
rmax = 100.0
rstep = 0.01
dataformat = QA
outputtype = sq, fq, gr
## Plot the specified results; a comma separated list of "iq"/"sq"/"fq"/"gr".
## No plot is produced when empty, "none" or "NONE".
plot = none

[TEMPERATURE]
# Name the start-document field holding sample temperature (or a placeholder).
temp_controller = hotairblower
