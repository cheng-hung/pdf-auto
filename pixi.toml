[workspace]
channels = ["conda-forge"]
name = "pdf-auto"
platforms = ["linux-64"]
version = "2026-1.0"

[system-requirements]
libc = "2.17"

[dependencies]
python = ">=3.12,<3.13"
bluesky-base = "==1.15.0"
# databroker registers Tiled's BlueskyRun structure clients, so that
# from_profile('pdf')[uid] returns a BlueskyRun with .start/.stop/.<stream>
# accessors that the reducer relies on. Without it, Tiled returns bare
# Containers and ImageData2D fails on ``self.run.start``.
databroker = "*"
event-model = "*"
tiled-client = "==0.2.16"
ipython = ">=9.5"
matplotlib-base = ">=3.10,<4"
numpy = ">2"
pandas = ">=3.0,<4"
pyside6 = "*"
pyfai = "==2025.3.0"
scipy = ">=1.17,<2"
tifffile = "*"
# tiled-client = ">=0.2.3,<0.3"

[pypi-dependencies]
# pdf-auto itself, installed from the current git branch on GitHub. This pulls
# what is PUSHED to origin/Live_dispatcher (push local commits to update). The
# package data (default INI) and console scripts come along with the install.
pdf-auto = { git = "https://github.com/cheng-hung/pdf-auto.git", branch = "Live_dispatcher" }
"diffpy.pdfgetx" = { path = "/home/xf28id1/Documents/pdfgetx-2.4.0-wheels/diffpy_pdfgetx-2.4.0-cp312-cp312-linux_x86_64.whl" }
pdfstream = { git = "https://github.com/NSLS-II-PDF/pdfstream.git", rev = "v0.5.x" }

[tasks]
# pdf-auto is now installed as a dependency, so the package is importable
# without PYTHONPATH. Only the Qt Matplotlib backend is set.
pdf-analysis = { cmd = "python -m pdf_auto pdf", env = { MPLBACKEND = "qtagg" } }
pdf-save = { cmd = "python -m pdf_auto save", env = { MPLBACKEND = "qtagg" } }
pdf-plot = { cmd = "python -m pdf_auto plot", env = { MPLBACKEND = "qtagg" } }
