[topics]
raw_db = pdf
an_db = pdf-analysis


# ZMQ source that the analysis-stream dispatcher (--mode analysis) listens to.
[LISTEN TO]
zmq_address = ipc:///var/lib/bluesky-zmq-proxy/pdf-ipc-in-ipc-out/out.sock
# RemoteDispatcher prefix filter; matches the publisher's document prefix.
prefix = raw


# This section defines all the files path required for stitching and calibration
[PATH]
user_data = /nsls2/data/pdf/pdfhack/legacy/processed/xpdacq_data/user_data
tiff_base = tiff_base
# tiff_base = tiff_base/test
config_base = config_base
pdfgetx = pdfgetx
# pilatus_PDF, pilatus_XRD have to be put in ~/config_base
pilatus_PDF = pilatus_PDF
pilatus_XRD = pilatus_XRD
pe1c_PDF = pe1c_PDF
pe1c_XRD = pe1c_XRD
pe2c_SAXS = pe2c_SAXS
lambda_SAXS = lambda_SAXS
# Masks and poin have to be put in ~/config_base/pilatus_PDF or ~/config_base/pilatus_XRD
mask_01 = Mask_pos1_ext_BS.npy
mask_02 = Mask_pos2_ext_BS.npy
mask_03 = Mask_pos3_ext_BS.npy
stitched_mask = Mask_stitched.npy
# stitched_mask = Mask_pos3_ext_BS.npy
merged_poin = merged.poni
# merged_poin = xpdAcq_calib_info.poni
mask_pe1c = Mask.npy
poni_pe1c = xpdAcq_calib_info.poni
mask_pe2c = Mask.npy
poni_pe2c = xpdAcq_calib_info.poni
mask_pilatus = Mask.npy
poni_pilatus = xpdAcq_calib_info.poni
mask_lambda = Mask.npy
poni_lambda = xpdAcq_calib_info.poni
# flat_filed has to be put in ~/config_base
flat_filed = flat_field
# flat_filed tiff have to be put in ~/config_base/flat_filed
flat_field_pila = flat_filed_pila.tiff
flat_field_pe1c = flat_filed_pe1c.tiff
flat_field_pe2c = flat_filed_pe2c.tiff
flat_field_lambda = flat_field_lambda.tiff



[SUM]
osetx = 27
osety = 27
use_flat_field_pila = False
use_flat_field_pe1c = False
use_flat_field_pe2c = False
use_flat_field_lambda = False
num_positions = 3
detector_Xmotor = Grid_X
detector_Ymotor = Grid_Y

## unit: mm
pixel_size = 0.172

## unit: m (if the distance from detector to sample smaller than this value, it will be seen as a PDF scan)
PDF_limit = 0.6

## unit: m (if the distance from detector to sample larger than this value, it will be seen as a SAXS scan)
SAXS_limit = 2.56

[INTEGRATION]
# npt_rad is equivalent to binning
npt_rad = 2048
npt_azim = 360
polarization = 0.99
UNIT = q_A^-1
low_limit_pcfilter = 2
up_limit_pcfilter = 98



[pdfgetx3]
do_reduction = True
use_auto_bkg = True
# backgroundfile = /nsls2/auto-storage/pdf/pdfhack/legacy/processed/xpdacq_data/user_data/tiff_base/empty_1mm_kapton_pdf/pilatus-1/iq/empty_1mm_kapton_pdf_20260714-110353_b45661_sum2.iq
backgroundfile =
# rpoly = 0.85
# bgscale = 1.55
rpoly = 0.95
qmaxinst = 29.0
qmin = 0.6
qmax = 22.0
rmin = 0.0
rmax = 100.0
rstep = 0.01
dataformat = QA
outputtype = sq, fq, gr
## Plot the specified results and activate interactive mode.
## A comma separated list with items such as "iq", "sq", "fq", "gr".
## No plot is produced when empty, "none" or "NONE".
plot = none
# file_prefix = {start[sample_name]}_{start[readable_time]}_{start[original_run_uid]:6.6}_



[TEMPERATURE]
# Select one of the tem_controler below and comment others
# temp_controller = None
# temp_controller = cryostat_C
temp_controller = hotairblower
# temp_controller = linkam_T96
# temp_controller = cryostream_T
# temp_controller = eurotherm3504
# temp_controller = thermocouple_c
